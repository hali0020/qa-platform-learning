server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Resolve the optional identity gateway only when this path is requested.
    # That keeps the default profile bootable when Keycloak is intentionally
    # absent while preserving a fixed, non-user-controlled upstream.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;

    location /identity/ {
        # Authorization requests contain state/nonce in the query string.
        # Never write the raw request target to the NGINX access log.
        access_log off;
        set $keycloak_gateway http://keycloak:8080;
        proxy_pass $keycloak_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:23010";
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "http";
        proxy_set_header X-Forwarded-Host "127.0.0.1";
        proxy_set_header X-Forwarded-Port "23010";
        # Keycloak itself serves KC_HTTP_RELATIVE_PATH=/identity. Supplying an
        # X-Forwarded-Prefix as well would describe the prefix twice.
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
        proxy_redirect off;

        # Defining headers here stops the SPA-specific CSP above from being
        # added to Keycloak pages; Keycloak's own login-page CSP passes through.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The authorization callback carries a one-time code and state in its
    # query string. Keep this exact location ahead of the general API proxy so
    # those values are not copied into the frontend access log.
    location = /api/v1/auth/oidc/callback {
        access_log off;
        proxy_pass http://backend:23100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
    }

    location /api/ {
        proxy_pass http://backend:23100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
