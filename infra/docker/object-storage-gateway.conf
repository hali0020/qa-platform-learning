upstream seaweedfs_s3 {
    zone seaweedfs_s3 64k;
    server seaweedfs-core:8333 resolve;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    keepalive 8;
}

server {
    listen 8333;
    server_name _;
    server_tokens off;

    access_log off;
    client_max_body_size 6m;

    location = /__gateway_health {
        return 204;
    }

    location / {
        limit_except GET HEAD PUT POST DELETE {
            deny all;
        }

        # The fixed upstream and Docker DNS let the gateway survive a core
        # container IP change without accepting a user-controlled target. With
        # no URI suffix, NGINX preserves the exact S3 request URI and query.
        proxy_pass http://seaweedfs_s3;

        # SigV4 includes Host in the signature. Preserve exactly what the
        # aiobotocore client signed for http://seaweedfs:8333.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }
}
