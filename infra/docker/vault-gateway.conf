upstream vault_core {
    zone vault_core 64k;
    server vault-core:8200 resolve;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    keepalive 8;
}

server {
    listen 8200;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /__gateway_health {
        return 204;
    }

    # Duplicate two tiny exact locations on purpose. A regex or broad prefix
    # would make it easier to expose future Vault paths accidentally.
    location = /v1/qa-platform/data/runtime {
        # NGINX treats HEAD as implicitly allowed by `limit_except GET`, so an
        # explicit method check is needed for the promised GET-only surface.
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://vault_core;
        proxy_http_version 1.1;
        proxy_set_header Host "vault-core:8200";
        proxy_set_header Connection "";
        proxy_set_header X-Vault-Token $http_x_vault_token;
        proxy_set_header X-Vault-Namespace "";
        proxy_set_header X-Vault-Wrap-TTL "";
        proxy_set_header X-Vault-MFA "";
        proxy_set_header X-Vault-Policy-Override "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /v1/qa-platform/data/providers {
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://vault_core;
        proxy_http_version 1.1;
        proxy_set_header Host "vault-core:8200";
        proxy_set_header Connection "";
        proxy_set_header X-Vault-Token $http_x_vault_token;
        proxy_set_header X-Vault-Namespace "";
        proxy_set_header X-Vault-Wrap-TTL "";
        proxy_set_header X-Vault-MFA "";
        proxy_set_header X-Vault-Policy-Override "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 404;
    }
}
