upstream keycloak_core {
    zone keycloak_core 64k;
    server keycloak-core:8080 resolve;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /__gateway_health {
        return 204;
    }

    # Only the lesson realm and its static login resources cross this gateway.
    # The master realm, Admin Console/API, management port and every other
    # realm remain reachable only from inside the keycloak-core container.
    location ^~ /identity/realms/qa-learning/ {
        proxy_pass http://keycloak_core;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:23010";
        proxy_set_header Connection "";

        # Overwrite rather than append all trusted proxy identity headers.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "http";
        proxy_set_header X-Forwarded-Host "127.0.0.1";
        proxy_set_header X-Forwarded-Port "23010";
        # The core already serves /identity via KC_HTTP_RELATIVE_PATH; do not
        # ask Keycloak to apply the same proxy prefix a second time.
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Original-Method "";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_set_header b3 "";
        proxy_set_header x-b3-traceid "";
        proxy_set_header x-b3-spanid "";
        proxy_set_header x-b3-parentspanid "";
        proxy_set_header x-b3-sampled "";
        proxy_set_header x-b3-flags "";
        proxy_set_header uber-trace-id "";
        proxy_set_header x-ot-span-context "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 65s;
    }

    location ^~ /identity/resources/ {
        proxy_pass http://keycloak_core;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:23010";
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "http";
        proxy_set_header X-Forwarded-Host "127.0.0.1";
        proxy_set_header X-Forwarded-Port "23010";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 65s;
    }

    location / {
        return 404;
    }
}
